<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C10" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0B1319" />
    </linearGradient>

    <!-- Electric Lime Glow & Accent -->
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#99CC00" stop-opacity="0.4" />
    </linearGradient>

    <!-- Architectural Grid Pattern -->
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#212830" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>

    <!-- Subtle Radial Glow behind Brand -->
    <radialGradient id="ambientGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#CCFF00" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #F0F6FC;
    }
    .role-badge {
      font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      fill: #CCFF00;
      text-transform: uppercase;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #9CA3AF;
      line-height: 1.6;
    }
    .tagline-bold {
      font-weight: 600;
      fill: #E6EDF3;
    }
    .spec-item {
      font-family: "SF Mono", Monaco, "Cascadia Code", "Roboto Mono", Consolas, monospace;
      font-size: 12px;
      fill: #8B949E;
    }
    .spec-value {
      font-weight: 600;
      fill: #CCFF00;
    }
    .infra-label {
      font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #8B949E;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="320" rx="16" fill="url(#bgGradient)" stroke="#27313B" stroke-width="1.5" />

  <!-- Grid Layer -->
  <rect width="960" height="320" rx="16" fill="url(#gridPattern)" />

  <!-- Ambient Light -->
  <rect width="960" height="320" rx="16" fill="url(#ambientGlow)" />

  <!-- Top Accent Bar (Electric Lime) -->
  <rect x="0" y="0" width="960" height="3.5" rx="2" fill="url(#limeGlow)" />

  <!-- Main Left Content Block -->
  <g transform="translate(48, 52)">
    <!-- Role Sub-Header / Chip -->
    <rect x="0" y="0" width="248" height="26" rx="6" fill="#161B22" stroke="#2E3B27" stroke-width="1" />
    <circle cx="12" cy="13" r="3.5" fill="#CCFF00" />
    <text x="24" y="17" class="role-badge">Full-Stack Engineer</text>

    <!-- Name Heading -->
    <text x="0" y="66" class="name-title">Alireza Ansari</text>

    <!-- Architectural Positioning Statement -->
    <text x="0" y="104" class="tagline">
      Designing &amp; building <tspan class="tagline-bold">end-to-end full-stack architectures</tspan> and
    </text>
    <text x="0" y="128" class="tagline">
      production-grade <tspan class="tagline-bold">AI knowledge retrieval (RAG) systems</tspan>.
    </text>

    <!-- Engineering Principles / Highlights -->
    <g transform="translate(0, 172)">
      <!-- Metric/Spec Item 1 -->
      <g transform="translate(0, 0)">
        <text class="spec-item"><tspan class="spec-value">01 /</tspan> Python · Django · FastAPI</text>
      </g>
      <!-- Metric/Spec Item 2 -->
      <g transform="translate(210, 0)">
        <text class="spec-item"><tspan class="spec-value">02 /</tspan> PostgreSQL · pgvector · RAG</text>
      </g>
      <!-- Metric/Spec Item 3 -->
      <g transform="translate(435, 0)">
        <text class="spec-item"><tspan class="spec-value">03 /</tspan> React · Next.js · TypeScript</text>
      </g>
    </g>
  </g>

  <!-- Right Visual Motif: Architecture Topology / Vector Graph -->
  <g transform="translate(755, 45)" opacity="0.95">
    <!-- Geometric Architecture Symbol Container -->
    <rect x="0" y="0" width="160" height="160" rx="14" fill="#111820" stroke="#27313B" stroke-width="1.2" />
    
    <!-- Coordinate / Matrix Dots -->
    <circle cx="30" cy="30" r="2" fill="#4B5563" />
    <circle cx="80" cy="30" r="2" fill="#4B5563" />
    <circle cx="130" cy="30" r="2" fill="#4B5563" />
    <circle cx="30" cy="80" r="2" fill="#4B5563" />
    <circle cx="80" cy="80" r="3" fill="#CCFF00" />
    <circle cx="130" cy="80" r="2" fill="#4B5563" />
    <circle cx="30" cy="130" r="2" fill="#4B5563" />
    <circle cx="80" cy="130" r="2" fill="#4B5563" />
    <circle cx="130" cy="130" r="2" fill="#4B5563" />

    <!-- Connection Paths -->
    <path d="M 30 30 L 80 80 L 130 30" fill="none" stroke="#2E3B27" stroke-width="1.5" />
    <path d="M 30 130 L 80 80 L 130 130" fill="none" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="3,3" />
    <path d="M 80 30 L 80 130" fill="none" stroke="#CCFF00" stroke-width="1" />

    <!-- Center Vector Core Node -->
    <circle cx="80" cy="80" r="9" fill="#0D1117" stroke="#CCFF00" stroke-width="2" />
    <circle cx="80" cy="80" r="3.5" fill="#CCFF00" />

    <!-- Status Indicator Box Below Graphic -->
    <rect x="0" y="174" width="160" height="26" rx="6" fill="#090D11" stroke="#212830" stroke-width="1" />
    <circle cx="18" cy="187" r="3" fill="#CCFF00" />
    <text x="28" y="190.5" class="infra-label">CORE INFRASTRUCTURE</text>
  </g>
</svg>
