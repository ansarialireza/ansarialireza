<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 20" width="100%" height="20" fill="none">
  <!-- Subtle line -->
  <line x1="0" y1="10" x2="920" y2="10" stroke="#212830" stroke-width="1" />
  
  <!-- Electric Lime accent center pulse -->
  <line x1="380" y1="10" x2="540" y2="10" stroke="url(#dividerGradient)" stroke-width="2" />
  
  <!-- Tiny center vector dot -->
  <circle cx="460" cy="10" r="3" fill="#CCFF00" />
  <circle cx="460" cy="10" r="6" stroke="#CCFF00" stroke-width="0.8" opacity="0.4" />

  <defs>
    <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0" />
      <stop offset="50%" stop-color="#CCFF00" stop-opacity="1" />
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0" />
    </linearGradient>
  </defs>
</svg>
